name: Build APK JINGGA Gold

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode proyek
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Siapkan proyek Capacitor
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Periksa konfigurasi Capacitor
        run: |
          if [ ! -f capacitor.config.json ]; then
            echo "File capacitor.config.json tidak ditemukan"
            exit 1
          fi

      - name: Siapkan Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Bangun APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Simpan hasil APK
        uses: actions/upload-artifact@v4
        with:
          name: JINGGA-Gold-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
